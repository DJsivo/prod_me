[project]
name = "prod-me"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas==3.0.6",
    "numpy==2.4.6",
    "scikit-learn==1.9.1",
    "matplotlib",
    "seaborn",
    "dvc",
    "joblib",
    "xgboost>=3.2.0",
    "lightgbm>=4.7.0",
    "catboost>=1.2.10",
    "optuna>=5.0.0",
    "shap>=0.51.0",
    "imbalanced-learn>=0.14.2",
]

[dependency-groups]
dev = ["ipykernel", "jupyterlab", "nbclient", "nbformat"]

[tool.uv]
package = false
