[project]
name = "neural-fraud-detection"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["pandas", "numpy", "scikit-learn", "matplotlib", "dvc", "joblib", "torch", "lightgbm", "umap-learn", "nbclient", "nbformat", "ipykernel"]
[tool.uv]
package = false
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
